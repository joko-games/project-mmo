[workspace]
resolver = "3"
members = ["crates/protocol", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.2"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
mmo-protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }

# Bevy recommends optimizing dependencies even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
